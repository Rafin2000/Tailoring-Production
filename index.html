<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailoring Production & Costing System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4 font-sans text-slate-800">

  <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden">
    <div class="bg-slate-900 text-white p-6 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">Tailoring Production Tracker</h1>
        <p class="text-xs text-slate-400 mt-1">Costing, Lead Time & Material Breakdown</p>
      </div>
      <i class="fa-solid fa-scissors text-3xl text-amber-500"></i>
    </div>

    <form id="costingForm" class="p-6 space-y-6">
      <div class="border-b pb-5">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-500 mb-3">১. সাধারণ তথ্য ও সময়কাল</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">পোশাকের নাম / ডিজাইন</label>
            <input type="text" id="dressName" required placeholder="e.g. Designer Kurti" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">শুরুর তারিখ (Start Date)</label>
            <input type="date" id="startDate" required class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" onchange="calculateAll()">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">শেষের তারিখ (End Date)</label>
            <input type="date" id="endDate" required class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" onchange="calculateAll()">
          </div>
        </div>
      </div>

      <div class="border-b pb-5">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-500 mb-3">২. কাপড়ের হিসাব (Fabric)</h2>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">মোট কাপড় (গজ)</label>
            <input type="number" step="0.1" id="fabricQty" value="0" class="w-full border rounded-lg p-2 text-sm outline-none" oninput="calculateAll()">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">প্রতি গজের দর (৳)</label>
            <input type="number" step="0.1" id="fabricRate" value="0" class="w-full border rounded-lg p-2 text-sm outline-none" oninput="calculateAll()">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">ওয়েস্টেজ (%)</label>
            <input type="number" step="0.1" id="fabricWastage" value="0" class="w-full border rounded-lg p-2 text-sm outline-none" oninput="calculateAll()">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">মোট কাপড় খরচ</label>
            <input type="text" id="totalFabricCost" readonly value="৳ 0.00" class="w-full bg-slate-100 font-bold border rounded-lg p-2 text-sm text-slate-700">
          </div>
        </div>
      </div>

      <div class="border-b pb-5">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-500 mb-3">৩. অন্যান্য ও মেকিং খরচ</h2>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">এক্সেসরিজ (বোতাম, জিপার, সুতা)</label>
            <input type="number" step="0.1" id="accCost" value="0" class="w-full border rounded-lg p-2 text-sm outline-none" oninput="calculateAll()">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">কারিগর মজুরি / কাটিং বিল</label>
            <input type="number" step="0.1" id="laborCost" value="0" class="w-full border rounded-lg p-2 text-sm outline-none" oninput="calculateAll()">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">অন্যান্য (আয়রন, ওয়াশ, ট্যাগ)</label>
            <input type="number" step="0.1" id="otherCost" value="0" class="w-full border rounded-lg p-2 text-sm outline-none" oninput="calculateAll()">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">মোট তৈরি পোশাকের সংখ্যা (Pcs)</label>
            <input type="number" id="batchPcs" value="1" min="1" class="w-full border rounded-lg p-2 text-sm outline-none" oninput="calculateAll()">
          </div>
        </div>
      </div>

      <div class="bg-slate-50 border border-slate-200 rounded-lg p-4 grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
        <div>
          <span class="block text-xs text-slate-500 font-medium">সময় লেগেছে</span>
          <span id="dispLeadDays" class="text-xl font-extrabold text-blue-600">0 দিন</span>
        </div>
        <div>
          <span class="block text-xs text-slate-500 font-medium">মোট কাপড় খরচ</span>
          <span id="dispFabricCost" class="text-xl font-extrabold text-slate-800">৳ 0</span>
        </div>
        <div>
          <span class="block text-xs text-slate-500 font-medium">সর্বমোট খরচ</span>
          <span id="dispTotalCost" class="text-xl font-extrabold text-emerald-600">৳ 0</span>
        </div>
        <div>
          <span class="block text-xs text-slate-500 font-medium">প্রতি পিস খরচ</span>
          <span id="dispPerPiece" class="text-xl font-extrabold text-amber-600">৳ 0</span>
        </div>
      </div>

      <div class="flex justify-end pt-2">
        <button type="submit" id="saveBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-6 rounded-lg shadow flex items-center gap-2">
          <i class="fa-solid fa-cloud-arrow-up"></i>
          <span>Save to Google Sheet</span>
        </button>
      </div>
    </form>
  </div>

  <script>
    // আপনার Apps Script Web App URL এখানে দিন
    const SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

    let calculatedData = {};

    function calculateAll() {
      // 1. Lead Days Calculation
      const start = new Date(document.getElementById('startDate').value);
      const end = new Date(document.getElementById('endDate').value);
      let days = 0;
      if (!isNaN(start) && !isNaN(end) && end >= start) {
        const diffTime = Math.abs(end - start);
        days = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1; // +1 to include both start & end
      }
      document.getElementById('dispLeadDays').innerText = days + " দিন";

      // 2. Fabric Cost
      const qty = parseFloat(document.getElementById('fabricQty').value) || 0;
      const rate = parseFloat(document.getElementById('fabricRate').value) || 0;
      const wastage = parseFloat(document.getElementById('fabricWastage').value) || 0;
      
      const rawFabricCost = qty * rate;
      const fabricTotal = rawFabricCost + (rawFabricCost * (wastage / 100));
      document.getElementById('totalFabricCost').value = "৳ " + fabricTotal.toFixed(2);
      document.getElementById('dispFabricCost').innerText = "৳ " + fabricTotal.toFixed(2);

      // 3. Other Costs
      const acc = parseFloat(document.getElementById('accCost').value) || 0;
      const labor = parseFloat(document.getElementById('laborCost').value) || 0;
      const other = parseFloat(document.getElementById('otherCost').value) || 0;
      const pcs = parseInt(document.getElementById('batchPcs').value) || 1;

      const grandTotal = fabricTotal + acc + labor + other;
      const perPiece = grandTotal / pcs;

      document.getElementById('dispTotalCost').innerText = "৳ " + grandTotal.toFixed(2);
      document.getElementById('dispPerPiece').innerText = "৳ " + perPiece.toFixed(2);

      // Cache data
      calculatedData = {
        dressName: document.getElementById('dressName').value,
        startDate: document.getElementById('startDate').value,
        endDate: document.getElementById('endDate').value,
        leadDays: days,
        fabricCost: fabricTotal.toFixed(2),
        accCost: acc.toFixed(2),
        laborCost: labor.toFixed(2),
        otherCost: other.toFixed(2),
        totalCost: grandTotal.toFixed(2),
        qty: pcs,
        perPieceCost: perPiece.toFixed(2)
      };
    }

    document.getElementById('costingForm').addEventListener('submit', function(e) {
      e.preventDefault();
      calculateAll();

      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(calculatedData)
      })
      .then(res => res.json())
      .then(response => {
        if(response.status === 'success') {
          alert("সফলভাবে Google Sheet-এ সেভ হয়েছে! Batch ID: " + response.batchId);
          document.getElementById('costingForm').reset();
          calculateAll();
        } else {
          alert("এরর: " + response.message);
        }
      })
      .catch(err => {
        alert("কানেকশন সমস্যা হয়েছে: " + err.message);
      })
      .finally(() => {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Save to Google Sheet';
      });
    });
  </script>
</body>
</html>
